name: Create signed release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Create release artifact
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          git archive \
            --format=tar.gz \
            --prefix="phishing-training-platform-${TAG_NAME}/" \
            --output="dist/phishing-training-platform-${TAG_NAME}.tar.gz" \
            HEAD

      - name: Sign release artifact
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          cosign sign-blob \
            --yes \
            --output-signature \
              "dist/phishing-training-platform-${TAG_NAME}.tar.gz.sig" \
            --output-certificate \
              "dist/phishing-training-platform-${TAG_NAME}.tar.gz.pem" \
            "dist/phishing-training-platform-${TAG_NAME}.tar.gz"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" \
            "dist/phishing-training-platform-${TAG_NAME}.tar.gz" \
            "dist/phishing-training-platform-${TAG_NAME}.tar.gz.sig" \
            "dist/phishing-training-platform-${TAG_NAME}.tar.gz.pem" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Release $TAG_NAME" \
            --generate-notes
