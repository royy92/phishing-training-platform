name: Feature Request
description: Propose an idea, change, or new capability for this project.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to improve the Phishing Awareness Training Platform? We'd love to hear it!

  - type: textarea
    id: problem-statement
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem is (e.g., I'm always disappointed when...).
      placeholder: Explain the problem you are facing...
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Describe the Solution You'd Like
      description: A clear and concise description of what you want to do.
      placeholder: Detail your proposed feature or enhancement...
    validations:
      required: true

  - type: textarea
    id: alternatives-considered
    attributes:
      label: Describe Alternatives You've Considered
      description: A clear and concise description of any alternative solutions or features you've considered.
      placeholder: Any workarounds or other solutions you thought about...
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context, code examples, screenshots, or mockups about the feature request here.
      placeholder: Any extra notes...
    validations:
      required: false
